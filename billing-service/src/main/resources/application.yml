server:
  port: 8086

spring:
  application:
    name: billing-service
  
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/flowbill}
    username: ${DATABASE_USERNAME:flowbill_user}
    password: ${DATABASE_PASSWORD:flowbill_pass}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

# Configuration Billing
billing:
  tva:
    default-rate: 20.00 # Taux TVA Maroc (20%)
    allowed-rates: [20.00, 14.00, 10.00, 7.00] # Taux autorisés
  
  quote:
    default-validity-days: 30 # Validité devis (30 jours)
  
  invoice:
    default-due-days: 30 # Échéance facture (30 jours)
  
  pdf:
    storage-path: ${PDF_STORAGE_PATH:/var/flowbill/invoices}
    template: invoice-template
  
  numbering:
    quote-prefix: DEV
    invoice-prefix: INV

# JWT (must match other services)
jwt:
  secret: ${JWT_SECRET:votre-secret-ultra-securise-256-bits-minimum}
  expiration: 86400000 # 24h

# Logging
logging:
  level:
    com.flowbill.billing: DEBUG
    org.hibernate.SQL: DEBUG
